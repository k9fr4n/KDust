services:
  kdust:
    build: .
    image: kdust:local
    container_name: kdust
    restart: unless-stopped
    # Labels Watchtower : présents en dev pour parité avec docker-compose.prod.yml.
    # Si tu fais tourner watchtower en local, il ne touchera quand même pas
    # `kdust:local` (pas de registry distant) — c'est juste pour la cohérence
    # des labels entre les deux composes.
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=kdust-autoupdate"
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Si ssh-agent est lancé sur l'hôte et SSH_AUTH_SOCK exporté,
      # l'agent sera utilisé en priorité sur les clés copiées.
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK:-}
      # Chemin HÔTE (résolu par Compose au parse time via ${PWD}) du
      # répertoire où sont les projets. Nécessaire pour que les agents
      # puissent construire des `docker run -v <host>:<container>` qui
      # marchent en DooD: le daemon Docker est sur l'hôte et interprète
      # les paths du flag -v comme des chemins hôte, pas comme des
      # chemins dans le container KDust. Sans cette variable, $(pwd)
      # à l'intérieur de KDust vaut /projects/... et le daemon ne
      # trouve rien à monter (dossier vide créé silencieusement).
      - KDUST_HOST_PROJECTS_ROOT=${PWD}/projects
      # Docker MCP gateway endpoint (ADR-0012, 2026-05-10).
      # Reachable only on the Compose-internal network (no public
      # ingress). Auth is disabled on the gateway via
      # DOCKER_MCP_IN_CONTAINER=1, so no Bearer header is needed.
      - MCP_GATEWAY_URL=http://mcp-gateway:8080/mcp
      - MCP_GATEWAY_SECRETS_DIR=/mcp-gateway/secrets
    volumes:
      - ./data:/data
      - ./projects:/projects
      # Skills library: baked into the image (Franck 2026-05-19, ADR-0016
      # update). The previous `./skills:/app/skills:ro` bind-mount has been
      # dropped — the catalogue is now versioned with the code and shipped
      # via the Docker image. See Dockerfile (runner stage) for the COPY.
      # Clefs SSH de l'hôte en read-only. L'entrypoint les copie ensuite
      # dans /home/kdust/.ssh avec les bonnes perms / ownership.
      - ${HOME}/.ssh:/host-ssh:ro
      # Socket ssh-agent (optionnel ; s'évapore si SSH_AUTH_SOCK vide)
      - ${SSH_AUTH_SOCK:-/dev/null}:${SSH_AUTH_SOCK:-/dev/null}
      # Docker socket (Franck 2026-04-20 23:46) - Option A / DooD.
      # Permet aux agents d'appeler `docker ...` via fs_cli__run_command.
      # Le GID du socket est aligné dynamiquement par l'entrypoint sur
      # le groupe `docker` du container, puis `node` y est ajouté.
      # [CRITICAL] accès = root sur l'hôte; cf. Dockerfile.
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker MCP gateway secrets dir (ADR-0012, 2026-05-10).
      # KDust écrit ./mcp-gateway/secrets/kdust-mcp.env (mode 0600)
      # à partir des Secret bindés sur les serveurs MCP, et la
      # gateway lit le même fichier en read-only via son propre
      # bind-mount. Côté KDust c'est en read-write.
      - ./mcp-gateway/secrets:/mcp-gateway/secrets
      # MCP gateway custom catalog (Franck 2026-05-18).
      # Read-only mount so /settings/mcp can build the per-server
      # tool inventory and scope the FilterEditorModal to the
      # server being edited. Same source file the gateway loads
      # via --additional-catalog=.
      - ./mcp-gateway/catalogs:/app/mcp-gateway/catalogs:ro
    # Self-hosted SSH identities runtime (Franck 2026-05-09, ADR-0011).
    # In-memory tmpfs where src/lib/ssh/bootstrap.ts materialises the
    # decrypted private keys at boot. mode=0700 + uid/gid=1000 so only
    # the `node` user (= the running Next.js process) can read it.
    # Size is intentionally small: a handful of ed25519 keys + the
    # generated config + known_hosts. NEVER bind-mount a host path
    # here -- the whole point is to keep keys out of the host fs.
    tmpfs:
      - /run/kdust/ssh:size=1m,mode=0700,uid=1000,gid=1000
    depends_on:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------- #
  # Docker MCP Gateway (Franck 2026-05-10, ADR-0012).                          #
  #                                                                            #
  # Long-lived multiplexer for catalog MCP servers from hub.docker.com/mcp.    #
  # KDust opens ONE streamable-HTTP MCP Client at boot (instrumentation.ts)    #
  # and re-exports the discovered tools per-project via                        #
  # DustMcpServerTransport.                                                    #
  #                                                                            #
  # Hardening:                                                                 #
  #   * `expose: 8080` (no `ports:`) -> reachable only from sibling Compose    #
  #     services. NEVER add a `ports:` mapping here.                           #
  #   * `DOCKER_MCP_IN_CONTAINER=1` -> auth bypass on the internal network     #
  #     (gateway expects Docker Desktop otherwise; we run headless).           #
  #   * `--block-secrets --verify-signatures` -> default-secure flags.         #
  #   * Image is signed by Docker; Watchtower auto-updates on the same scope  #
  #     `kdust-autoupdate` as kdust itself.                                    #
  #                                                                            #
  # Active server list is hard-coded in `command:` for V1. To add/remove a    #
  # server: edit `--servers=...` then `docker compose up -d mcp-gateway`.     #
  # KDust's MCP Client reconnects automatically and re-runs tools/list.        #
  #                                                                            #
  # Secrets are NOT in env: they live in /secrets/kdust-mcp.env (rw on the     #
  # kdust side, ro on the gateway side) and are loaded via `--secrets=`.       #
  # See docs/mcp-gateway.md.                                                   #
  # -------------------------------------------------------------------------- #
  # ews-mcp-patched is a purely local Docker image (built from
  # mcp-gateway/images/ews-mcp-patched/Dockerfile). It's not on any
  # registry, so an `docker system prune` on the host wipes it and the
  # gateway can't restart ews-mcp. This init service rebuilds the image
  # if it's missing before the gateway starts — using DooD via the host
  # docker.sock. Build context is piped as a tar over stdin because the
  # host daemon can't see paths inside this container (Franck 2026-05-18).
  ews-mcp-builder:
    image: docker:cli
    container_name: kdust-ews-mcp-builder
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mcp-gateway/images/ews-mcp-patched:/build:ro
    # NB: keep the script as the *third* element of `entrypoint:`
    # (one argv slot). Splitting it across `entrypoint:` + `command:`
    # makes Compose tokenise the block scalar into separate argv
    # entries, which ends up running `sh -c set` (set with no args
    # dumps every shell variable). Tested 2026-05-18.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if docker image inspect ews-mcp-patched:local >/dev/null 2>&1; then
          echo "[ews-mcp-builder] ews-mcp-patched:local present, skipping build."
          exit 0
        fi
        echo "[ews-mcp-builder] ews-mcp-patched:local missing, rebuilding..."
        tar -C /build -cf - . | docker build -t ews-mcp-patched:local -
        echo "[ews-mcp-builder] build OK."

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: kdust-mcp-gateway
    restart: unless-stopped
    pull_policy: always
    depends_on:
      ews-mcp-builder:
        condition: service_completed_successfully
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=kdust-autoupdate"
    environment:
      - DOCKER_MCP_IN_CONTAINER=1
    command:
      - --transport=streaming
      - --port=8080
      # Catalog plumbing (lessons learned 2026-05-17):
      # - In the headless docker/mcp-gateway image there is NO built-in
      #   catalog (no Docker Desktop, no ~/.docker/mcp/catalogs/). The
      #   official catalog must be passed explicitly via --catalog=<url>.
      # - --additional-catalog appends our project catalog on top.
      # - --servers= disables dynamic tool discovery, so each catalog
      #   entry MUST enumerate its tools (see kdust-custom.yaml).
      - --catalog=https://desktop.docker.com/mcp/catalog/v3/catalog.yaml
      - --additional-catalog=/catalogs/kdust-custom.yaml
      - --servers=github-official,ews-mcp,thruk-mcp
      - --secrets=/secrets/kdust-mcp.env
      - --block-secrets
      # --verify-signatures removed (2026-05-17): ews-mcp is a third-party
      # GHCR image (ghcr.io/azizmazrou/ews-mcp) not signed by Docker.
      # Hardening: pin a sha256 digest in mcp-gateway/catalogs/kdust-custom.yaml
      # once the server is validated. Default-deny per-project (ProjectMcpToolFilter)
      # remains the primary safeguard.
      - --log-calls
    volumes:
      # Required: the gateway spawns its child MCP containers on the host
      # daemon (DooD inception, audited in ADR-0012).
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only secrets file, written by KDust at boot and on every
      # Secret edit. Mode 0600, owned by uid 1000.
      - ./mcp-gateway/secrets:/secrets:ro
      # Custom catalog (2026-05-17): declares servers outside the official
      # Docker MCP hub (e.g. ews-mcp). KDust-versioned, read-only inside
      # the gateway. Edit on host, then `docker compose up -d mcp-gateway`.
      - ./mcp-gateway/catalogs:/catalogs:ro
    expose:
      - "8080"
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2.0
