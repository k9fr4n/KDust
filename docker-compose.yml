# docker-compose.yml — single canonical stack (Franck 2026-05-20).
#
# Image-only deployment: KDust pulls the pre-built multi-arch
# (amd64 + arm64) image from ghcr.io — no local build needed.
# The previous `docker-compose.prod.yml` has been merged in here;
# there is no separate dev compose any more.
#
# Pré-requis sur le host :
#   1. docker login ghcr.io -u <ton-github-login> -p <PAT>
#      (le PAT GitHub doit avoir le scope read:packages)
#   2. cp .env.example .env && nano .env   (remplir tous les secrets)
#   3. mkdir -p data projects
#
# Démarrage :
#   docker compose up -d
#
# Mise à jour automatique :
#   Watchtower vérifie ghcr.io toutes les 5 minutes.
#   Dès qu'une nouvelle image :latest est disponible, il pull + redémarre kdust.

services:
  kdust:
    # Pas de build: — on tire l'image pré-buildée depuis ghcr.io
    # L'image est multi-arch (amd64 + arm64) : Docker choisit automatiquement
    # la bonne variante selon l'hôte.
    image: ghcr.io/k9fr4n/kdust:latest
    container_name: kdust
    restart: unless-stopped
    pull_policy: always          # tire la dernière image à chaque `up`
    # Labels Watchtower : ce conteneur sera surveillé et mis à jour automatiquement.
    # Le `scope` est OBLIGATOIRE : watchtower tourne avec WATCHTOWER_SCOPE=kdust-autoupdate
    # et ignore tout container qui n'a pas le label `scope` correspondant, même
    # avec `enable=true` (cf. --label-enable + WATCHTOWER_SCOPE, sémantique AND).
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=kdust-autoupdate"
    ports:
      - "4000:3000"
      # IDE auth-proxy (ADR-0028). On by default; keep this behind
      # your host TLS reverse-proxy. Set IDE_ENABLED=false to disable.
      - "4001:8443"
    env_file: .env
    environment:
      - SSH_AUTH_SOCK=${SSH_AUTH_SOCK:-}
      # code-server IDE (ADR-0028). On by default; set IDE_ENABLED=false
      # to disable. Requires the kdust-ide sidecar (defined below) to be
      # up. The proxy verifies the kdust_session JWT before reaching
      # code-server.
      - IDE_ENABLED=${IDE_ENABLED:-true}
      - IDE_UPSTREAM=http://kdust-ide:8080
      - IDE_PROXY_PORT=8443
      # Public base URL the browser uses to reach the IDE proxy. Leave
      # empty to derive <current-host>:4001 client-side. Set it when
      # KDust sits behind a TLS reverse-proxy (e.g. https://kdust.example.com:4001).
      - IDE_PUBLIC_URL=${IDE_PUBLIC_URL:-}
      # Chemin HÔTE du répertoire projects (résolu par Compose via ${PWD}).
      # Nécessaire pour les montages DooD (-v host_path:container_path).
      - KDUST_HOST_PROJECTS_ROOT=${PWD}/projects
      # Docker MCP gateway endpoint (ADR-0012, 2026-05-10).
      # Internal network only — pas d'auth Bearer (DOCKER_MCP_IN_CONTAINER=1).
      - MCP_GATEWAY_URL=http://mcp-gateway:8080/mcp
      - MCP_GATEWAY_SECRETS_DIR=/mcp-gateway/secrets
    volumes:
      - ./data:/data
      - ./projects:/projects
      # Skills library: baked into the image (Franck 2026-05-19, ADR-0016
      # update). Bind-mount dropped — see docker-compose.yml + Dockerfile.
      # NB (Franck 2026-05-21): the former `/tmp/thruk-report` bind mount
      # is gone. The upstream thruk-mcp WORKDIR/spill mechanism was
      # removed, so the cross-container handoff is no longer needed.
      # The kdust/thruk-monitoring-report skill still uses
      # /tmp/thruk-report internally as scratch (wiped by save.sh init
      # on every run) — purely in-container, no host persistence.
      # Clefs SSH de l'hôte (read-only, copiées par l'entrypoint)
      - ${HOME}/.ssh:/host-ssh:ro
      # Socket ssh-agent (optionnel)
      - ${SSH_AUTH_SOCK:-/dev/null}:${SSH_AUTH_SOCK:-/dev/null}
      # Docker socket — DooD (accès = root sur l'hôte, cf. Dockerfile)
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker MCP gateway secrets dir (ADR-0012). KDust écrit
      # ./mcp-gateway/secrets/kdust-mcp.env (mode 0600), la gateway
      # le lit en ro via son propre bind-mount.
      - ./mcp-gateway/secrets:/mcp-gateway/secrets
      # MCP gateway custom catalog (Franck 2026-05-18). Read-only
      # mount so /settings/mcp peut scoper le picker de tools par
      # serveur. Même source que --additional-catalog côté gateway.
      - ./mcp-gateway/catalogs:/app/mcp-gateway/catalogs:ro
    # Self-hosted SSH identities runtime (Franck 2026-05-09, ADR-0011).
    # Cf. docker-compose.yml pour le détail.
    tmpfs:
      - /run/kdust/ssh:size=1m,mode=0700,uid=1000,gid=1000
    depends_on:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------- #
  # code-server IDE sidecar (Franck 2026-06-03, ADR-0028).                     #
  #                                                                            #
  # Browser VS Code scoped to /projects, reached ONLY through the KDust        #
  # auth-proxy (kdust :4001 -> kdust_session JWT -> kdust-ide:8080).           #
  #                                                                            #
  # [SECURITY] Deliberately has NO docker.sock mount: the web terminal         #
  # can edit /projects but cannot reach the host Docker daemon, so the         #
  # blast radius is the workspace, not the host. Do NOT add docker.sock        #
  # here. Not published directly (expose only) and not Watchtower-scoped       #
  # (pinned tag, manual upgrades).                                             #
  # -------------------------------------------------------------------------- #
  kdust-ide:
    image: codercom/code-server:4.122.0-bookworm
    container_name: kdust-ide
    restart: unless-stopped
    # Claude Code wiring (Franck 2026-06-03). Point the Anthropic SDK
    # at the in-stack dust-exporter proxy so `claude` in the IDE
    # terminal talks to Dust agents. dust-exporter requires no API key
    # by default, so ANTHROPIC_API_KEY is a non-empty placeholder the
    # CLI insists on. Pick the agent at runtime with
    #   ANTHROPIC_MODEL=<agent-sId> claude
    # (see `GET /v1/models` or docs/ide.md). dust-exporter is started
    # with --client-tools (see its `command:` below), so Claude Code's
    # own Read/Edit/Bash run HERE (this sidecar has NO docker.sock —
    # blast radius stays /projects).
    environment:
      - ANTHROPIC_BASE_URL=http://dust-exporter:8787
      - ANTHROPIC_API_KEY=dummy
    depends_on:
      - dust-exporter
    # Default image user is `coder` (uid 1000) — matches the host
    # ./projects ownership (node, uid 1000), so edits work without chown.
    command:
      - --auth=none
      - --bind-addr=0.0.0.0:8080
      - --disable-telemetry
      - --disable-update-check
      - /projects
    volumes:
      - ./projects:/projects
      # Persist the whole home on ONE named volume. Mounting on
      # /home/coder (which EXISTS in the image, owned by coder uid 1000)
      # makes Docker init the volume with coder ownership, so
      # code-server can create ~/.config and ~/.local itself. Mounting
      # the non-existent ~/.config / ~/.local/share subpaths instead
      # yields root-owned volumes -> EACCES on startup (ADR-0028 fix).
      - ide-home:/home/coder
    expose:
      - "8080"
    mem_limit: 2g
    mem_reservation: 256m

  # -------------------------------------------------------------------------- #
  # dust-exporter — Anthropic/OpenAI-compatible proxy in front of Dust         #
  # agents (Franck 2026-06-03). Lets Claude Code (Anthropic Messages API)      #
  # in the kdust-ide terminal talk to your Dust agents.                        #
  #                                                                            #
  # [SECURITY] Internal-only: `expose` (no host `ports:`), so it is reachable  #
  # solely on the compose network — never published, honouring the            #
  # no-public-ingress rule. Holds the dust-cli OAuth session on its own        #
  # private volume; authenticate ONCE with the device flow:                    #
  #   docker compose run --rm dust-exporter login                             #
  #   docker compose run --rm dust-exporter status   # authenticated: true     #
  # Deliberately NO docker.sock mount and NO env_file — the image ships sane   #
  # defaults (host 0.0.0.0, port 8787, file credential store on /data).        #
  # --client-tools is set on `command:` so the CLIENT (Claude Code in          #
  # kdust-ide) executes the tools locally; see docs/ide.md.                    #
  # Private GHCR image, multi-arch (amd64 + arm64); Watchtower-scoped like     #
  # the rest of the stack.                                                     #
  # -------------------------------------------------------------------------- #
  dust-exporter:
    image: ghcr.io/k9fr4n/dust-exporter:latest
    container_name: kdust-dust-exporter
    restart: unless-stopped
    pull_policy: always
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=kdust-autoupdate"
    # ENTRYPOINT is `npx tsx src/index.ts`; override CMD to enable
    # client-tools passthrough (Claude Code drives, executes locally).
    command:
      - serve
      - --client-tools
    volumes:
      # OAuth session (credentials.json) + conversation-state map.
      - dust-exporter-data:/data
    expose:
      - "8787"
    mem_limit: 512m
    mem_reservation: 64m

  # -------------------------------------------------------------------------- #
  # Docker MCP Gateway (Franck 2026-05-10, ADR-0012).                          #
  # Voir docker-compose.yml pour le commentaire complet.                       #
  # -------------------------------------------------------------------------- #
  # Init service: rebuilds ews-mcp-patched:local on `docker compose up` if
  # it's not in the host's image cache (e.g. wiped by `docker system prune`).
  # Cf. docker-compose.yml pour le détail de l'implémentation DooD.
  ews-mcp-builder:
    image: docker:cli
    container_name: kdust-ews-mcp-builder
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mcp-gateway/images/ews-mcp-patched:/build:ro
    # NB: garder le script comme 3e élément de `entrypoint:` (un seul
    # slot argv). Séparer en entrypoint+command fait que Compose
    # tokenise le block scalar en argv distincts et finit par lancer
    # `sh -c set` (qui dump tout l'env). Vérifié 2026-05-18.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if docker image inspect ews-mcp-patched:local >/dev/null 2>&1; then
          echo "[ews-mcp-builder] ews-mcp-patched:local present, skipping build."
          exit 0
        fi
        echo "[ews-mcp-builder] ews-mcp-patched:local missing, rebuilding..."
        tar -C /build -cf - . | docker build -t ews-mcp-patched:local -
        echo "[ews-mcp-builder] build OK."

  mcp-gateway:
    image: docker/mcp-gateway:latest
    container_name: kdust-mcp-gateway
    restart: unless-stopped
    pull_policy: always
    depends_on:
      ews-mcp-builder:
        condition: service_completed_successfully
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=kdust-autoupdate"
    environment:
      - DOCKER_MCP_IN_CONTAINER=1
    command:
      - --transport=streaming
      - --port=8080
      # Catalog plumbing (lessons learned 2026-05-17): the headless gateway
      # has no built-in catalog, so we pass the official URL explicitly.
      # --additional-catalog appends our project catalog; --servers=
      # disables dynamic discovery, so entries must enumerate their tools.
      - --catalog=https://desktop.docker.com/mcp/catalog/v3/catalog.yaml
      - --additional-catalog=/catalogs/kdust-custom.yaml
      # playwright retiré 2026-05-18 (Franck): non utilisé dans le flux KDust,
      # encombrait /settings/mcp avec 23 tools parasites.
      - --servers=ews-mcp,thruk-mcp
      - --secrets=/secrets/kdust-mcp.env
      - --block-secrets
      # --verify-signatures removed (2026-05-17): ews-mcp is a third-party
      # GHCR image (ghcr.io/azizmazrou/ews-mcp) not signed by Docker.
      # Hardening: pin a sha256 digest in mcp-gateway/catalogs/kdust-custom.yaml
      # once the server is validated. Default-deny per-project filters remain.
      - --log-calls
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mcp-gateway/secrets:/secrets:ro
      # Custom catalog (2026-05-17). Same convention as docker-compose.yml.
      - ./mcp-gateway/catalogs:/catalogs:ro
    expose:
      - "8080"
    mem_limit: 1g
    mem_reservation: 128m
    cpus: 2.0

  # -------------------------------------------------------------------------- #
  # Watchtower — mise à jour automatique du conteneur kdust                    #
  # Surveille ghcr.io toutes les 5 minutes (300s).                             #
  # Dès qu'une nouvelle image est détectée : pull silencieux + redémarrage.    #
  # -------------------------------------------------------------------------- #
  watchtower:
    # NOTE: containrrr/watchtower is unmaintained since 2024 — :latest ships an
    # ancient Docker API client (1.25) that recent daemons reject with
    # "client version 1.25 is too old. Minimum supported API version is 1.40".
    # nickfedor/watchtower is the actively maintained community fork
    # (drop-in compatible, same `com.centurylinklabs.watchtower.*` labels).
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      # Accès au daemon Docker pour inspecter et redémarrer les conteneurs
      - /var/run/docker.sock:/var/run/docker.sock
      # Credentials Docker de l'hôte (docker login ghcr.io fait plus haut)
      # Watchtower les lit pour pouvoir puller des images privées
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      # Belt-and-braces: force a modern Docker API version on the client side
      # so we don't rely on the image's default again if the fork ever drifts.
      DOCKER_API_VERSION: "1.44"
      # Ne surveille QUE le conteneur kdust (pas watchtower lui-même, etc.)
      WATCHTOWER_SCOPE: kdust-autoupdate
      # Vérifie toutes les 5 minutes
      WATCHTOWER_POLL_INTERVAL: "300"
      # Supprime l'ancienne image après mise à jour (libère de la place)
      WATCHTOWER_CLEANUP: "true"
      # Log level lisible
      WATCHTOWER_DEBUG: "false"
      # Notifie dans les logs Docker (visible via `docker logs watchtower`)
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ""   # laisser vide = logs uniquement
    # Watchtower ne surveille que les conteneurs qui portent ce label
    command: --label-enable --interval 300 --cleanup

# Named volumes — code-server IDE persistence (ADR-0028). The whole
# coder home (settings, extensions, VS Code user data) survives
# container recreation. Single volume mounted on /home/coder so it
# inherits coder(1000) ownership from the image (avoids EACCES).
volumes:
  ide-home:
  # dust-exporter OAuth session (credentials.json) + conversation-state
  # map. Survives container recreation so the one-time device-flow login
  # is not lost on `docker compose pull` / restart.
  dust-exporter-data:
