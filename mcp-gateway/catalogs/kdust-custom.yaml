# KDust custom MCP catalog — servers NOT in the official Docker MCP hub.
#
# Loaded by the gateway via --catalog=/catalogs/kdust-custom.yaml. The
# `name:` field at the bottom is the catalog identifier; entries under
# `registry:` are server slugs referenced from --servers=... in the
# compose command.
#
# Secret VALUES are NOT in this file — they live in kdust-mcp.env, written
# at boot by src/lib/mcp/gateway-secrets.ts from the McpServerSecret
# bindings. The `name:` of each secret below is the catalog key bound in
# /settings/mcp; the `env:` is the variable the underlying image actually
# consumes.
#
# Linux gotcha: env vars MUST be declared under `secrets:` (the `config:`
# block is Docker Desktop only). Non-sensitive values (auth_type, timezone)
# still go here.
#
# Hardening recommendation: once a server is validated, pin its image by
# sha256 digest (image: ghcr.io/.../ews-mcp@sha256:...) so Watchtower can
# no longer auto-update it.

name: kdust-custom
displayName: KDust custom MCP servers

registry:
  ews-mcp:
    title: Exchange Web Services MCP
    description: |
      Microsoft Exchange / Office 365 mailbox control — email, calendar,
      contacts, tasks, folders, attachments, threads, search. Third-party
      server (ghcr.io/azizmazrou/ews-mcp, MIT). Not signed by Docker;
      consider pinning a sha256 digest in production.
    # Locally-built wrapper image: ews-mcp-patched:local. Two upstream
    # issues patched (banner-on-stdout, gosu vs no-new-privileges) — see
    # mcp-gateway/images/ews-mcp-patched/Dockerfile for the full story.
    # The gateway runs children with --pull never, so we don't need a
    # registry push. Each KDust host must `docker build` this image once.
    image: ews-mcp-patched:local
    type: server
    # The MCP gateway disables dynamic tool discovery when --servers= is
    # used (verified via `docker-mcp gateway run --help`). Catalog entries
    # MUST enumerate their tools, otherwise the gateway reports 0 tools.
    # The list below was captured 2026-05-17 from ews-mcp v3.4 / 1.27.0
    # via a stdio probe. Refresh after a major server upgrade.
    tools:
      # email (14)
      - name: create_draft
      - name: create_reply_draft
      - name: create_forward_draft
      - name: send_email
      - name: read_emails
      - name: search_emails
      - name: get_email_details
      - name: get_emails_bulk
      - name: delete_email
      - name: move_email
      - name: update_email
      - name: copy_email
      - name: reply_email
      - name: forward_email
      # attachments (7)
      - name: list_attachments
      - name: download_attachment
      - name: add_attachment
      - name: delete_attachment
      - name: read_attachment
      - name: get_email_mime
      - name: attach_email_to_draft
      # calendar (7)
      - name: create_appointment
      - name: get_calendar
      - name: update_appointment
      - name: delete_appointment
      - name: respond_to_meeting
      - name: check_availability
      - name: find_meeting_times
      # contacts (3) + intelligence (2)
      - name: create_contact
      - name: update_contact
      - name: delete_contact
      - name: find_person
      - name: analyze_contacts
      # tasks (5)
      - name: create_task
      - name: get_tasks
      - name: update_task
      - name: complete_task
      - name: delete_task
      # search (1)
      - name: search_by_conversation
      # folders (3)
      - name: list_folders
      - name: find_folder
      - name: manage_folder
      # out-of-office (1)
      - name: oof_settings
      # agent-secretary v4 (21)
      - name: memory_set
      - name: memory_get
      - name: memory_list
      - name: memory_delete
      - name: track_commitment
      - name: list_commitments
      - name: resolve_commitment
      - name: submit_for_approval
      - name: list_pending_approvals
      - name: approve
      - name: reject
      - name: get_voice_profile
      - name: rule_create
      - name: rule_list
      - name: rule_delete
      - name: rule_simulate
      - name: evaluate_rules_on_message
      - name: configure_oof_policy
      - name: get_oof_policy
      - name: apply_oof_policy
      - name: generate_briefing
      - name: prepare_meeting
      - name: execute_approved_action
    secrets:
      - name: ews-mcp.auth_type
        env: EWS_AUTH_TYPE
        description: "Auth mode — ntlm for on-prem Exchange"
      - name: ews-mcp.server_url
        env: EWS_SERVER_URL
        description: "Explicit EWS endpoint (https://.../EWS/Exchange.asmx)"
      - name: ews-mcp.autodiscover
        env: EWS_AUTODISCOVER
        description: "false when EWS_SERVER_URL is set explicitly"
      - name: ews-mcp.email
        env: EWS_EMAIL
        description: "Primary mailbox SMTP address"
      - name: ews-mcp.username
        env: EWS_USERNAME
        description: "NTLM username in DOMAIN\\\\user form"
      - name: ews-mcp.password
        env: EWS_PASSWORD
        description: "NTLM password"
      - name: ews-mcp.timezone
        env: TIMEZONE
        description: "IANA TZ name (e.g. Europe/Paris)"

  thruk-mcp:
    title: Thruk Monitoring MCP
    description: |
      MCP server for Thruk — the unified web frontend for Naemon, Nagios,
      Icinga and Shinken. Exposes Thruk's REST API: read host/service
      state, history, comments, downtimes; write tools for acknowledge,
      downtime scheduling and forced rechecks. First-party gateway-ready
      image (ghcr.io/k9fr4n/thruk-mcp, MIT — stdio default, non-root, no
      stdout banner). Source: https://github.com/k9fr4n/thruk-mcp.
      Hardening: pin a sha256 digest in production. Strongly recommended
      to start with thruk-mcp.read_only=true and open writes case-by-case
      via thruk-mcp.enabled_tools (fnmatch allowlist).
    # Track the floating :latest tag (Franck 2026-05-18).
    # NB: the MCP gateway does NOT auto-pull child images — Docker
    # uses the locally cached layer by tag. To pick up a new push,
    # run on the host:
    #   docker pull ghcr.io/k9fr4n/thruk-mcp:latest \
    #     && docker restart kdust-mcp-gateway
    # The gateway respawns its sub-container against the refreshed
    # cache on next tool call.
    image: ghcr.io/k9fr4n/thruk-mcp:latest
    type: server
    # NOTE (Franck 2026-05-21): the upstream large-response spill
    # mechanism (THRUK_MCP_WORKDIR + bind-mounted /tmp/thruk-report,
    # issue k9fr4n/thruk-mcp#49) has been removed. Large payloads now
    # come back as Dust `fil_*` references that the agent downloads
    # via `export_fil_to_workdir` before feeding them to
    # `save.sh --from-file` in the kdust/thruk-monitoring-report skill.
    # DO NOT re-add `volumes:` or `THRUK_MCP_WORKDIR` here.
    # Tools enumerated because --servers= disables dynamic discovery.
    # Captured 2026-05-29 from thruk-mcp v1.6.1 (catalog/tools.json) —
    # 50 tools total (was 43 in v1.4.0). Refresh after every minor
    # bump; if the gateway reports a different count, mismatched
    # image cache (run `docker pull ghcr.io/k9fr4n/thruk-mcp:latest`).
    #
    # Delta since v1.4.0:
    #   v1.5.0 (+7): thruk_list_contacts, thruk_get_contact,
    #                thruk_bulk_acknowledge, thruk_add_comment,
    #                thruk_delete_comment, thruk_checks
    #                (+ thruk_problem_counts groundwork)
    #   v1.6.0:      filter support on thruk_stats (signature change,
    #                same tool name — see schema in catalog/tools.json)
    #   v1.6.1 (+2 / -1): + thruk_totals, + thruk_problem_counts
    #                     - thruk_problems_by_hostgroup (ghost tool,
    #                       never implemented upstream; superseded by
    #                       thruk_problem_counts)
    tools:
      # read — state (10)
      - name: thruk_list_hosts
      - name: thruk_get_host
      - name: thruk_list_services
      - name: thruk_get_service
      - name: thruk_list_hostgroups
      - name: thruk_list_servicegroups
      - name: thruk_problems
      - name: thruk_stats           # v1.6.0: now accepts a structured filter tree
      - name: thruk_totals          # v1.6.1: compact host+service counts (16 fields)
      - name: thruk_sites
      # read — contacts (2) — added v1.5.0 (2026-05-26)
      - name: thruk_list_contacts
      - name: thruk_get_contact
      # read — history & comments (7)
      - name: thruk_list_logs
      - name: thruk_list_alerts
      - name: thruk_list_notifications
      - name: thruk_recent_events
      - name: thruk_list_comments
      - name: thruk_list_downtimes
      - name: thruk_get_downtime
      # read — noise & flap analysis (3) — added v1.1 (2026-05-21)
      - name: thruk_top_noisy_hosts
      - name: thruk_top_noisy_services
      - name: thruk_flap_summary
      # read — problem intelligence (4) — added v1.2 (2026-05-21),
      # thruk_problems_by_hostgroup removed in v1.6.1 (ghost tool).
      - name: thruk_oldest_problems
      - name: thruk_unacked_critical
      - name: thruk_stale_acks
      - name: thruk_problem_counts  # v1.6.1: replaces thruk_problems_by_hostgroup
      # read — log analytics (3) — added v1.3 (2026-05-21)
      - name: thruk_alert_heatmap
      - name: thruk_concurrent_failures
      - name: thruk_recurring_problems
      # read — availability / SLA (3) — added v1.4 (2026-05-25)
      - name: thruk_host_availability
      - name: thruk_service_availability
      - name: thruk_hostgroup_availability
      # write — checks & notifications control (2) — added v1.4/v1.5
      # NB: cascade=true propagates to every service of the host —
      # keep behind THRUK_READ_ONLY=true or an explicit
      # THRUK_ENABLED_TOOLS allowlist until validated in prod.
      - name: thruk_checks          # v1.5.0: enable/disable active checks
      - name: thruk_notifications
      # write — downtime management (8)
      - name: thruk_schedule_downtime
      - name: thruk_schedule_host_services_downtime
      - name: thruk_schedule_propagated_host_downtime
      - name: thruk_schedule_hostgroup_downtime
      - name: thruk_schedule_servicegroup_downtime
      - name: thruk_delete_downtime
      - name: thruk_delete_active_downtimes
      - name: thruk_delete_downtimes_by_filter
      # write — problem handling (4)
      - name: thruk_acknowledge
      - name: thruk_bulk_acknowledge  # v1.5.0: ack by filter (hostgroup/state)
      - name: thruk_remove_acknowledgement
      - name: thruk_recheck
      # write — comments (2) — added v1.5.0
      - name: thruk_add_comment
      - name: thruk_delete_comment
      # escape hatches (2)
      - name: thruk_query
      - name: thruk_run_background_query
    secrets:
      - name: thruk-mcp.base_url
        env: THRUK_BASE_URL
        description: "Thruk URL, no trailing slash (https://monitor/thruk)"
      - name: thruk-mcp.api_key
        env: THRUK_API_KEY
        description: "X-Thruk-Auth-Key header value"
      # Optional secrets removed 2026-05-18 (Franck):
      # verify_ssl / read_only / enabled_tools / default_backends /
      # max_concurrent. Declaring them here without binding a Secret
      # in /settings/mcp made the gateway inject `<UNKNOWN>` as their
      # value, which crashed thruk-mcp on startup with
      #   ValueError: invalid literal for int() with base 10: '<UNKNOWN>'
      # (max_concurrent is parsed as int). Re-add a line below + bind
      # a Secret if you want to override the upstream defaults
      # (THRUK_MAX_CONCURRENT=0, THRUK_VERIFY_SSL=true, THRUK_READ_ONLY=false,
      # THRUK_ENABLED_TOOLS=, THRUK_DEFAULT_BACKENDS=).
      #
      # Strong recommendation when going to production:
      #   echo "true" | <bind a Secret named thruk-mcp.read_only>
      # so writes (acknowledge, downtime, recheck) are stripped by
      # thruk-mcp itself as a defense-in-depth layer behind the
      # per-project filter (ProjectMcpToolFilter, default-deny).
